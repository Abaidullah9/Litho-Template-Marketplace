<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <title>Sign in | Template Marketplace Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/style.css?v=20261008-01">
    <link rel="stylesheet" href="/assets/css/admin.css?v=20261008-01">
    <script>(function(){var t=null;try{t=localStorage.getItem("litho-theme")}catch(e){}document.documentElement.dataset.theme=/^[a-z0-9-]{1,32}$/.test(t||"")?t:"dark";})();</script>
  </head>
  <body class="admin-page">
    <main class="login-shell">
      <div class="login-card">
        <a class="login-brand" href="/index.html" aria-label="Template Marketplace home"><img src="/assets/img/litho-wordmark.png?v=20261007-01" alt="" width="656" height="192"><span>TEMPLATE MARKETPLACE</span></a>
        <h1>Admin sign in</h1>
        <p class="lead">Protected dashboard — templates, submissions, taxonomy and the generated registry.</p>
        <form id="login-form" novalidate>
          <div class="field" style="margin-bottom:14px">
            <label for="username">Admin username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
            <span class="field-error" data-error-for="username"></span>
          </div>
          <div class="field" style="margin-bottom:14px">
            <label for="password">Admin password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <span class="field-error" data-error-for="password"></span>
          </div>
          <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in →</button>
          <p id="login-message" class="field-hint" style="margin-top:14px;min-height:16px"></p>
        </form>
      </div>
    </main>
    <script type="module" src="/assets/js/admin/login.js?v=20261008-01"></script>
  </body>
</html>
